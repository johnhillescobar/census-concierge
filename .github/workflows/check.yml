name: check

# The gate. No API keys, no network beyond dependency install, under a minute.
# Integration tests need live OpenAI and Census keys and are excluded here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_invariants --base needs the merge base, not a shallow clone.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy api/src

      - name: tests
        # Exit 5 is "no tests collected", the correct state until slice 1. Any
        # other non-zero is a real failure. The `||` keeps `bash -e` from
        # aborting before the code is inspected.
        run: uv run pytest -q -m "not integration" || [ $? -eq 5 ]

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web tests
        run: |
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run typecheck

      - name: budgets (structural)
        # The quality floors live in the `scoreboard` job below. This one must
        # be green at all times, so that a regression in it means something.
        run: uv run python scripts/check_budgets.py --structural-only

      - name: invariants
        # A PR is diffed against its target branch; a push to main against its
        # own parent, so a direct commit cannot weaken a budget either.
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            uv run python scripts/check_invariants.py
          else
            uv run python scripts/check_invariants.py --base "$base"
          fi

  scoreboard:
    # The quality floors: retrieval@1, answered rate, p95 latency.
    #
    # THIS JOB IS EXPECTED TO BE RED UNTIL SLICE 0 SHIPS. That is the design —
    # the scaffold cannot be turned green by writing code, only by making
    # retrieval work. It is a separate job so that `check` staying green means
    # something day to day, and so this one turning green is an event.
    #
    # Do not add continue-on-error. Do not lower a floor to make it pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: quality floors
        run: uv run python scripts/check_budgets.py

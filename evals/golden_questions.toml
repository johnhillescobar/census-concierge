# Golden question set — this file is the product specification.
#
# Write it BEFORE the agent exists. Everything downstream is judged against it.
#
# !! VERIFY EVERY expect_table BEFORE TRUSTING THIS FILE. !!
# These IDs were written from memory as a starting point. A wrong fixture is
# worse than no fixture: it will train you to "fix" correct behaviour. Check
# each one at https://api.census.gov/data/2023/acs/acs5/groups.html and delete
# this warning when you have.
#
# tier:
#   core      — the common tables most users already know. Cheap to pass.
#               These prove nothing on their own; the previous project passed
#               questions like these while retrieval was a stub.
#   long_tail — outside any one person's specialty. THIS IS THE REAL METRIC.
#   trap      — the answer is "no" or "not like that". Silent wrong answers here
#               are the ones that destroy trust with researchers.

# --- core --------------------------------------------------------------------


# --- traps — silent wrong answers here lose the user permanently -------------

[[question]]
id = "t01"
text = "Compare median household income between 2015-2019 and 2018-2022"
expect_table = "B19013"
tier = "trap"
expect_warning = "overlapping_vintage"
note = "Overlapping ACS 5-year periods are not comparable. Must warn, not silently chart."

[[question]]
id = "t02"
text = "Median family income by county in Iowa"
expect_table = "B19113"
tier = "trap"
note = "FAMILY income, not household. Returning B19013 is the canonical universe error."

[[question]]
id = "t03"
text = "Is the poverty rate in tract 1201 higher than tract 1305?"
tier = "trap"
expect_warning = "moe_not_significant"
note = "Tract MOEs usually swamp the difference. Must say so rather than rank them."

[[question]]
id = "t04"
text = "Median household income for every block group in Wyoming"
tier = "trap"
expect_warning = "geography_unsupported"
note = "Detailed tables at block-group level are limited and MOEs are extreme."

[[question]]
id = "t05"
text = "Population of Springfield"
tier = "trap"
expect_warning = "ambiguous_place"
note = "Show the candidate Springfields as results. Do NOT block with a question."

[[question]]
id = "t06"
text = "What share of households are Black families earning over $75k?"
tier = "trap"
expect_warning = "universe_mismatch"
note = "Crosses two universes (households x families). Must surface the conflict."

[[question]]
id = "t07"
text = "Population of Phoenix in 2024 from the 1-year ACS"
expect_table = "B01003"
tier = "trap"
note = "Vintage availability. Should not silently substitute a different year."

[[question]]
id = "t08"
text = "Give me the income distribution, not just the median, for Travis County"
expect_table = "B19001"
tier = "trap"
note = "Tests distribution-vs-summary discrimination within one topic."

# --- traps — multi-year series (slice 3) -------------------------------------
#
# Every failure below is SILENT: the agent returns a series, it charts cleanly,
# and it is wrong. These are the hardest questions in the file.

[[question]]
id = "t09"
text = "Number of cell phones in Denver since 2017"
expect_table = "B28001"
expect_geo_level = "place"
topic = "devices"
tier = "trap"
expect_warning = "measure_unavailable"
note = """The Census counts no devices anywhere in ACS. B28001 counts HOUSEHOLDS \
in which someone has a smartphone. The universe correction must come before any \
series is fetched. Denver clears 65k, so ACS1 is available for 2017-2019 and \
2021-2023; 2020 is not."""

[[question]]
id = "t10"
text = "Plot median household income for Cuyahoga County every year from 2017 to 2023"
expect_table = "B19013"
expect_geo_level = "county"
topic = "income"
tier = "trap"
expect_warning = "overlapping_vintage"
note = """Seven consecutive ACS5 vintages share four of five sample years each. \
Valid answers: ACS1 annual (Cuyahoga qualifies), or non-overlapping ACS5 at 2017 \
and 2022. A seven-point ACS5 line is the canonical silent failure."""

[[question]]
id = "t11"
text = "Unemployment in Middlebury, Vermont each year since 2017"
expect_table = "B23025"
expect_geo_level = "place"
topic = "employment"
tier = "trap"
expect_warning = "acs1_geography_ineligible"
note = """Middlebury is far under 65,000, so annual ACS1 does not exist for it. \
Must say so plainly rather than returning an overlapping ACS5 series as if it \
were annual. Non-overlapping ACS5 gives two usable points."""

[[question]]
id = "t12"
text = "1-year ACS poverty for Fresno County, 2018 through 2022"
expect_table = "B17001"
expect_geo_level = "county"
topic = "poverty"
tier = "trap"
expect_warning = "vintage_gap_2020"
note = """The standard 2020 ACS1 release was never issued. Return four years with \
2020 stated as absent and shown as a gap. Never interpolate, never bridge the \
line, never quietly return four points as if five were requested."""

[[question]]
id = "t13"
text = "Broadband subscription trend by census tract in Wayne County, 2018 to 2022"
expect_table = "B28002"
expect_geo_level = "tract"
topic = "internet"
tier = "trap"
expect_warning = "boundary_change_2020"
note = """Tract geometry was redrawn for the 2020 census, so a series crossing it \
compares different polygons. Compounded by tract MOEs that swamp most annual \
change - the significance test should suppress most of this 'trend'."""

[[question]]
id = "t14"
text = "How has the share of households with a computer changed since 2013?"
expect_table = "B28001"
topic = "devices"
tier = "trap"
expect_warning = "variable_not_in_vintage"
note = """The computer and internet tables were introduced and then reworked \
mid-decade; the requested range starts before the variables exist in their \
current form. Check each vintage's variables.json - a variable that exists but \
means something different is worse than one that errors."""

# --- traps — cross-geography comparison (slice 3) ----------------------------

[[question]]
id = "t15"
text = "Median household income for ZIP code 10001 every year since 2018"
expect_table = "B19013"
expect_geo_level = "zip code tabulation area"
topic = "income"
tier = "trap"
expect_warning = "zcta_not_zip"
note = """Two failures stacked. ZIP codes are USPS delivery routes, not areas; \
the Census publishes ZCTAs, which approximate them from blocks and do not cover \
every ZIP. And ZCTA is 5-year only - there is no annual ZCTA series to plot. \
2020 ZCTA definitions also differ from 2010."""

[[question]]
id = "t16"
text = "Compare poverty by census tract within the city of Denver"
expect_table = "B17001"
topic = "poverty"
tier = "trap"
expect_warning = "geography_not_nested"
note = """Tracts nest in counties; Denver is a place. Places cross county lines, \
so 'tracts in Denver' is not expressible in the for/in grammar. Denver County is \
coextensive with the city, which makes this answerable HERE and not in most \
cities - the agent must say which it used."""

[[question]]
id = "t17"
text = "What is the median household income across these five tracts combined?"
expect_table = "B19013"
expect_geo_level = "tract"
topic = "income"
tier = "trap"
expect_warning = "median_not_aggregatable"
note = """Medians cannot be combined by any weighting of published medians. The \
plausible wrong answer - averaging them, or weighting by population - is the \
failure. B19001 brackets summed across tracts would support an approximation; \
offer that instead of refusing flatly."""

[[question]]
id = "t18"
text = "Total population without health insurance across every tract in Wayne County"
expect_table = "B27001"
expect_geo_level = "tract"
topic = "health"
tier = "trap"
expect_warning = "moe_aggregation_degraded"
note = """Estimates sum. MOEs do not: MOE_total = sqrt(sum of MOE_i^2), and that \
approximation degrades badly across hundreds of tracts. Summing MOEs linearly - \
the intuitive move - overstates the interval enormously."""

# --- long tail — comparisons that must SUCCEED -------------------------------
#
# A guard-only eval measures refusals, not capability. These two must return
# data, not warnings.

[[question]]
id = "q23"
text = "Compare median gross rent in Austin to the Texas average"
expect_table = "B25064"
expect_geo_level = "place"
topic = "rent"
tier = "long_tail"
note = """Cross-level comparison, both legal, two calls. Austin sits inside Texas \
so the estimates are not independent and the standard difference-of-MOE formula \
overstates variance. Must report whether the difference is significant."""

[[question]]
id = "q24"
text = "Median household income for ZCTA 90210"
expect_table = "B19013"
expect_geo_level = "zip code tabulation area"
topic = "income"
tier = "long_tail"
note = """The ZCTA path must actually work for a single 5-year vintage. Pairs \
with t15: knowing when ZCTA is wrong is useless if ZCTA is never reachable."""

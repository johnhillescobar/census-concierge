# The application. `check_budgets.py` counts [project.dependencies] here against
# the direct_dependencies budget of 25.
#
# Dependencies arrive with the slice that needs them, never in advance. What is
# listed below is what slice 0 requires: pull ACS metadata, embed, and search.
# FastAPI, the database driver, and Langfuse land in slices 1, 5 and 8.

[project]
name = "census-concierge-api"
version = "0.1.0"
description = "Conversational Census data concierge — retrieval-first."
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.1",
    "openai>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

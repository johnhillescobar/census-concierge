# The application. `check_budgets.py` counts [project.dependencies] here against
# the direct_dependencies budget of 25.
#
# Dependencies arrive with the slice that needs them, never in advance. Slice 0
# needed metadata, embeddings, and search. FastAPI is slice 1. The database
# driver and Langfuse land in slices 5 and 8.

[project]
name = "census-concierge-api"
version = "0.1.0"
description = "Conversational Census data concierge — retrieval-first."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.28",
    "langchain-core>=1.5.5",
    "numpy>=2.1",
    "openai>=1.60",
    "psycopg[binary,pool]>=3.2",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
